server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD}

jwt:
  secret: ${JWT_SECRET}

ai:
  service:
    base-url: ${AI_SERVICE_URL}

logging:
  level:
    root: info
    com.club.management: info
    com.baomidou.mybatisplus: info
    org.springframework.security: warn
